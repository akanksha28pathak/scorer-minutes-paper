[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scorer-minutes"
version = "0.1.0"
description = "Hardware-normalized, noise-aware evaluation of coding agents under wall-clock budgets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
scorer-minutes = "scorer_minutes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
